```yaml
# Workflow name displayed in GitHub Actions
name: CD Web Deployment Pipeline

# Trigger deployment when code is pushed to main
on:
  push:
    branches: ["main"]

# Permissions required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Deployment job
jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Download repository code
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      # Step 2: Configure GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # Step 3: Package website files
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Step 4: Publish website
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4